name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, test, and build
        run: pnpm turbo lint typecheck test build

  evals:
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Blocking eval — no-fabrication (spec 10.6)
        run: pnpm eval:no-fabrication

      - name: AI guardrail evals (fake provider)
        run: pnpm evals

      - name: Email classify eval (fake provider)
        run: pnpm eval:email

  e2e:
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
      CI: "1"
      E2E_PORT: "3100"
      VAGAPILOT_REQUIRE_SUPABASE: "1"
      KEY_PROVIDER: local
      AI_PROVIDER: fake
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: latest

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Ephemeral crypto key for e2e (not a production secret)
        run: |
          KEK=$(openssl rand -base64 32)
          echo "::add-mask::$KEK"
          echo "KEK_LOCAL=$KEK" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_APP_URL=http://127.0.0.1:${E2E_PORT}" >> "$GITHUB_ENV"
          echo "E2E_ALLOW_LOCAL_APP_URL=1" >> "$GITHUB_ENV"

      - name: Start Supabase and reset DB
        run: |
          set -euo pipefail
          EXCLUDES="-x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime"
          for attempt in 1 2 3 4 5; do
            if supabase start $EXCLUDES; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "supabase start failed after 5 attempts"
              exit 1
            fi
            echo "supabase start failed (attempt ${attempt}); retrying in 30s..."
            sleep 30
          done
          pnpm db:reset

      - name: Export Supabase env for Playwright
        run: |
          STATUS=$(supabase status -o json)
          echo "SUPABASE_URL=$(echo "$STATUS" | jq -r '.API_URL')" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_URL=$(echo "$STATUS" | jq -r '.API_URL')" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$STATUS" | jq -r '.SERVICE_ROLE_KEY // .SECRET_KEY')" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(echo "$STATUS" | jq -r '.ANON_KEY // .PUBLISHABLE_KEY')" >> "$GITHUB_ENV"

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps
        working-directory: apps/web

      - name: Build web for e2e (next start)
        run: pnpm --filter web build

      - name: Playwright e2e (port 3100)
        run: pnpm --filter web test:e2e
        working-directory: .

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/test-results
            apps/web/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  rls:
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
      # Fail instead of skipping when the local stack is missing.
      VAGAPILOT_REQUIRE_SUPABASE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: latest

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Start Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,mailpit

      - name: Reset database and run RLS tests
        run: pnpm db:reset && pnpm --filter @vagapilot/db test
