# VagaPilot web. Paths are relative to the repository root.
# Netlify installs @netlify/plugin-nextjs on the build. Do not add an SPA
# catch-all: it would serve index.html for SSR pages and API routes.

[build]
  base = "apps/web"
  command = "cd ../.. && pnpm install --frozen-lockfile && pnpm --filter web build"
  publish = ".next"
  # Build when the app, shared packages, Supabase migrations, Netlify functions or the
  # lockfile change (the default only watched apps/web, so packages/-only commits were
  # skipped). Root configs (pnpm-workspace.yaml, turbo.json, tsconfig.json) also trigger
  # builds. Paths are relative to base. Exit 0 = skip, 1 = build.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../../packages ../../netlify ../../netlify.toml ../../pnpm-lock.yaml ../../package.json ../../supabase ../../pnpm-workspace.yaml ../../turbo.json ../../tsconfig.json"

[build.environment]
  NODE_VERSION = "22"
  # Not credentials. AI_PROVIDER=fake is a dev flag and matches the word "fake"
  # all over the repo. The Supabase URL, project ref and publishable/anon keys
  # are public and Next inlines them into the edge bundle.
  SECRETS_SCAN_OMIT_KEYS = "AI_PROVIDER,SUPABASE_PROJECT_REF,SUPABASE_URL,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,NEXT_PUBLIC_SUPABASE_ANON_KEY"

# Cloud apply worker (background function, 15 min). playwright-core only speaks CDP to the
# remote browser providers; no local Chromium is bundled.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["playwright-core"]
