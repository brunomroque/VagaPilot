<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Job - LinkedIn (fixture)</title></head>
<body>
  <h1>Senior Engineer</h1>
  <button class="jobs-apply-button" aria-label="Easy Apply to Senior Engineer" onclick="openModal()">Easy Apply</button>
  <div class="jobs-easy-apply-modal" role="dialog" style="display:none">
    <div id="s1">
      <label for="em">Email address</label><input id="em" type="email" autocomplete="email" required>
      <label for="ph">Mobile phone number</label><input id="ph" type="tel" required>
      <button aria-label="Continue to next step" onclick="go(2)">Next</button>
    </div>
    <div id="s2" style="display:none">
      <fieldset><legend>Are you legally authorized to work in Brazil?</legend>
        <label><input type="radio" name="auth" value="Yes" required>Yes</label>
        <label><input type="radio" name="auth" value="No">No</label>
      </fieldset>
      <button aria-label="Review your application" onclick="go(3)">Review</button>
    </div>
    <div id="s3" style="display:none">
      <p>Review your application</p>
      <button aria-label="Submit application" onclick="submitApp()">Submit application</button>
    </div>
  </div>
  <div id="sent" style="display:none">Your application was sent to ACME</div>
<script>
  function openModal() { document.querySelector(".jobs-easy-apply-modal").style.display = "block" }
  function go(n) { for (const i of [1,2,3]) document.getElementById("s" + i).style.display = i === n ? "block" : "none" }
  function submitApp() { document.querySelector(".jobs-easy-apply-modal").style.display = "none"; document.getElementById("sent").style.display = "block" }
</script>
</body>
</html>
